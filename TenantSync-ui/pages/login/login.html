<div class="start-page">
  <div class="login-card">
    <h1 class="logo">TenantSync</h1>

    <p class="subtitle">
      Manage tenants, roles, and access
    </p>

    <form class="login-form">
      <input
        type="email"
        placeholder="Email"
        aria-label="Email"
      />

      <input
        type="password"
        placeholder="Password"
        aria-label="Password"
      />

      <button type="button" (click)="goNext()">
        Get Started
      </button>
    </form>
  </div>
</div>
